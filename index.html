<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUN & FUN - Dijital Menü</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f5f5f0;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #f5f5f0;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 1px solid #e0e0dc;
        }
        .header-brand {
            font-size: 28px;
            font-weight: 700;
            color: #c73729;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .slogan {
            font-family: 'Great Vibes', cursive;
            font-size: 26px;
            color: #ee8e00;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex-grow: 1;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        #page-language {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
        }
        .lang-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
        }
        .lang-btn {
            background-color: #ffffff;
            border: 2px solid #c73729;
            color: #c73729;
            padding: 14px 20px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .lang-btn span.flag {
            font-size: 22px;
        }
        .lang-btn:hover {
            background-color: #c73729;
            color: #ffffff;
            transform: translateY(-2px);
        }
        .back-bar {
            margin-bottom: 20px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #c73729;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #222;
        }
        .category-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .category-card {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
            border-left: 5px solid #c73729;
        }
        .category-card:hover {
            transform: scale(1.01);
        }
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .product-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
        }
        .product-thumb {
            width: 75px;
            height: 75px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #eaeaea;
            flex-shrink: 0;
        }
        .product-thumb-placeholder {
            width: 75px;
            height: 75px;
            border-radius: 8px;
            background-color: #e5e5e0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 10px;
            color: #777;
            font-weight: 600;
            padding: 4px;
            flex-shrink: 0;
            line-height: 1.2;
        }
        .product-info {
            flex-grow: 1;
        }
        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #222;
            margin-bottom: 2px;
        }
        .product-desc-preview {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: #c73729;
        }
        .detail-box {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .detail-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            background-color: #eaeaea;
            margin-bottom: 20px;
        }
        .detail-img-placeholder {
            width: 100%;
            height: 180px;
            border-radius: 12px;
            background-color: #e5e5e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .detail-title {
            font-size: 22px;
            font-weight: 700;
            color: #222;
            margin-bottom: 10px;
        }
        .detail-desc {
            font-size: 15px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .detail-price {
            font-size: 24px;
            font-weight: 700;
            color: #c73729;
        }
        .loading-text {
            text-align: center;
            padding: 30px;
            color: #666;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">BUN & FUN BURGER</div>
        <div class="slogan">fun in every bite</div>
    </header>

    <div class="container" id="main-container">
        
        <div id="page-language" class="page active">
            <div class="loading-text" id="loading-msg">Menü yükleniyor...</div>
            <div class="lang-buttons" id="lang-buttons-container" style="display:none;">
                <button class="lang-btn" onclick="selectLanguage('tr')">
                    <span class="flag">🇹🇷</span> Türkçe
                </button>
                <button class="lang-btn" onclick="selectLanguage('en')">
                    <span class="flag">🇬🇧</span> English
                </button>
                <button class="lang-btn" onclick="selectLanguage('ru')">
                    <span class="flag">🇷🇺</span> Русский
                </button>
            </div>
        </div>

        <div id="page-categories" class="page">
            <div class="section-title" id="txt-cat-title">Kategoriler</div>
            <div id="category-container" class="category-grid"></div>
        </div>

        <div id="page-products" class="page">
            <div class="back-bar">
                <button class="back-btn" onclick="goToPage('page-categories')">← <span id="txt-back-cat">Kategoriler</span></button>
            </div>
            <div class="section-title" id="product-section-title">Ürünler</div>
            <div id="product-container" class="product-list"></div>
        </div>

        <div id="page-detail" class="page">
            <div class="back-bar">
                <button class="back-btn" onclick="backToProducts()">← <span id="txt-back-prod">Ürünlere Dön</span></button>
            </div>
            <div class="detail-box">
                <div id="detail-img-container"></div>
                <h2 id="detail-title" class="detail-title">Ürün Adı</h2>
                <p id="detail-desc" class="detail-desc">Açıklama</p>
                <div id="detail-price" class="detail-price">0 TL</div>
            </div>
        </div>

    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdNmjIQYSsH6Wt1yluSA7KvQhyUhJCpPXB8PKPH2sLF-fxe-vfhGCdw0KVzmWVquyIvcg8iIE_KZa9/pub?gid=0&single=true&output=csv";
        
        let menuData = {
            tr: { backCat: "Kategoriler", backProd: "Ürünlere Dön", catTitle: "Kategoriler", soonText: "Görseller Çok Yakında", categories: [] },
            en: { backCat: "Categories", backProd: "Back to Products", catTitle: "Categories", soonText: "Photos Coming Soon", categories: [] },
            ru: { backCat: "Категории", backProd: "Назад к товарам", catTitle: "Категории", soonText: "Фото скоро будут", categories: [] }
        };

        let currentLang = 'tr';
        let currentCatIndex = 0;

        // CSV Verisini Parçalama (Basit CSV Parser)
        function parseCSV(text) {
            let lines = text.split("\n");
            let result = [];
            let headers = lines[0].split(",");

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                let currentLine = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                let obj = {};
                for (let j = 0; j < headers.length; j++) {
                    let val = currentLine[j] ? currentLine[j].trim() : "";
                    if (val.startsWith('"') && val.endsWith('"')) {
                        val = val.substring(1, val.length - 1);
                    }
                    obj[headers[j].trim()] = val;
                }
                result.push(obj);
            }
            return result;
        }

        // Google Sheets verisini çekip yapıya oturtma
        async function fetchMenuData() {
            try {
                let response = await fetch(csvUrl);
                let data = await response.text();
                let rows = parseCSV(data);

                // Kategorileri gruplamak için geçici objeler
                let catsTR = {}, catsEN = {}, catsRU = {};

                rows.forEach(row => {
                    let catNameTR = row.Kategori_TR;
                    if (!catNameTR) return;

                    // TR
                    if (!catsTR[catNameTR]) catsTR[catNameTR] = [];
                    catsTR[catNameTR].push({
                        name: row.Ad_TR,
                        desc: row.Aciklama_TR,
                        price: row.Fiyat,
                        image: row.Gorsel || ""
                    });

                    // EN
                    let catNameEN = row.Kategori_EN || catNameTR;
                    if (!catsEN[catNameEN]) catsEN[catNameEN] = [];
                    catsEN[catNameEN].push({
                        name: row.Ad_EN || row.Ad_TR,
                        desc: row.Aciklama_EN || row.Aciklama_TR,
                        price: row.Fiyat,
                        image: row.Gorsel || ""
                    });

                    // RU
                    let catNameRU = row.Kategori_RU || catNameTR;
                    if (!catsRU[catNameRU]) catsRU[catNameRU] = [];
                    catsRU[catNameRU].push({
                        name: row.Ad_RU || row.Ad_TR,
                        desc: row.Aciklama_RU || row.Aciklama_TR,
                        price: row.Fiyat,
                        image: row.Gorsel || ""
                    });
                });

                // menuData formatına dönüştür
                menuData.tr.categories = Object.keys(catsTR).map(name => ({ name, products: catsTR[name] }));
                menuData.en.categories = Object.keys(catsEN).map(name => ({ name, products: catsEN[name] }));
                menuData.ru.categories = Object.keys(catsRU).map(name => ({ name, products: catsRU[name] }));

                // Yükleniyor yazısını kaldır, butonları göster
                document.getElementById('loading-msg').style.display = 'none';
                document.getElementById('lang-buttons-container').style.display = 'flex';

            } catch (error) {
                console.error("Menü yüklenirken hata oluştu:", error);
                document.getElementById('loading-msg').innerText = "Menü yüklenemedi. Lütfen internet bağlantınızı kontrol edin.";
            }
        }

        // Sayfa açıldığında veriyi çek
        window.onload = fetchMenuData;

        function goToPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const targetPage = document.getElementById(pageId);
            if (targetPage) {
                targetPage.classList.add('active');
            }
            window.scrollTo(0, 0);
        }

        function selectLanguage(lang) {
            currentLang = lang;
            
            const langPage = document.getElementById('page-language');
            if (langPage) {
                langPage.classList.remove('active');
            }
            
            document.getElementById('txt-back-cat').innerText = menuData[lang].backCat;
            document.getElementById('txt-back-prod').innerText = menuData[lang].backProd;
            document.getElementById('txt-cat-title').innerText = menuData[lang].catTitle;

            renderCategories();
            goToPage('page-categories');
        }

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            menuData[currentLang].categories.forEach((cat, index) => {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `<span>${cat.name}</span> <span>→</span>`;
                card.onclick = () => openCategory(index);
                container.appendChild(card);
            });
        }

        function openCategory(catIndex) {
            currentCatIndex = catIndex;
            const cat = menuData[currentLang].categories[catIndex];
            const dataLang = menuData[currentLang];
            document.getElementById('product-section-title').innerText = cat.name;

            const container = document.getElementById('product-container');
            container.innerHTML = '';

            cat.products.forEach((prod) => {
                const pCard = document.createElement('div');
                pCard.className = 'product-card';

                let thumbHtml = '';
                if (prod.image && prod.image.trim() !== "") {
                    thumbHtml = `<img class="product-thumb" src="${prod.image}" alt="${prod.name}">`;
                } else {
                    thumbHtml = `<div class="product-thumb-placeholder">${dataLang.soonText}</div>`;
                }

                pCard.innerHTML = `
                    ${thumbHtml}
                    <div class="product-info">
                        <div class="product-name">${prod.name}</div>
                        <div class="product-desc-preview">${prod.desc}</div>
                        <div class="product-price">${prod.price}</div>
                    </div>
                `;
                pCard.onclick = () => openProductDetail(prod);
                container.appendChild(pCard);
            });

            goToPage('page-products');
        }

        function backToProducts() {
            openCategory(currentCatIndex);
        }

        function openProductDetail(prod) {
            const containerEl = document.getElementById('detail-img-container');
            const dataLang = menuData[currentLang];
            containerEl.innerHTML = '';

            if (prod.image && prod.image.trim() !== "") {
                const imgEl = document.createElement('img');
                imgEl.className = 'detail-img';
                imgEl.src = prod.image;
                imgEl.alt = prod.name;
                containerEl.appendChild(imgEl);
            } else {
                const placeholderEl = document.createElement('div');
                placeholderEl.className = 'detail-img-placeholder';
                placeholderEl.innerText = dataLang.soonText;
                containerEl.appendChild(placeholderEl);
            }

            document.getElementById('detail-title').innerText = prod.name;
            document.getElementById('detail-desc').innerText = prod.desc;
            document.getElementById('detail-price').innerText = prod.price;

            goToPage('page-detail');
        }
    </script>
</body>
</html>
