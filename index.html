        </div>

        // Otomatik Güncelleme Mekanizması
        let menuData;
        const localData = localStorage.getItem('bunfun_menu_data');
        if (localData) {
            try {
                const parsed = JSON.parse(localData);
                if (parsed.version === defaultMenuData.version) {
                    menuData = parsed;
                } else {
                    menuData = defaultMenuData;
                    localStorage.setItem('bunfun_menu_data', JSON.stringify(defaultMenuData));
                }
            } catch (e) {
                menuData = defaultMenuData;
            }
        } else {
            menuData = defaultMenuData;
            localStorage.setItem('bunfun_menu_data', JSON.stringify(defaultMenuData));
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'bunfun_menu_data' && e.newValue) {
                menuData = JSON.parse(e.newValue);
                renderCategories();
            }
        });

        let currentLang = 'tr';
        let currentCatIndex = 0;

        function goToPage(pageId) {
            document.querySelectorAll('.page').forEach(p => {
                p.classList.remove('active');
            });
            
            const targetPage = document.getElementById(pageId);
            if (targetPage) {
                targetPage.classList.add('active');
            }
            window.scrollTo(0, 0);
        }

        function selectLanguage(lang) {
            currentLang = lang;
            const t = uiTexts[currentLang];
            
            document.getElementById('txt-back-lang').innerText = t.backLang;
            document.getElementById('txt-back-cat').innerText = t.backCat;
            document.getElementById('txt-back-prod').innerText = t.backProd;
            document.getElementById('txt-cat-title').innerText = t.catTitle;

            renderCategories();
            goToPage('page-categories');
        }

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            menuData.categories.forEach((cat, index) => {
                const card = document.createElement('div');
                card.className = 'category-card';
                // Tablodan/veriden seçilen dile ait kategori adını alıyoruz
                const displayName = (cat.name && cat.name[currentLang]) ? cat.name[currentLang] : cat.key;
                card.innerHTML = `<span>${displayName}</span> <span>→</span>`;
                card.onclick = () => openCategory(index);
                container.appendChild(card);
            });
        }

        function openCategory(catIndex) {
            currentCatIndex = catIndex;
            const cat = menuData.categories[catIndex];
            const t = uiTexts[currentLang];
            document.getElementById('product-section-title').innerText = (cat.name && cat.name[currentLang]) ? cat.name[currentLang] : cat.key;

            const container = document.getElementById('product-container');
            container.innerHTML = '';

            cat.products.forEach((prod) => {
                const pCard = document.createElement('div');
                pCard.className = 'product-card';

                let thumbHtml = '';
                if (prod.image && prod.image.trim() !== "") {
                    thumbHtml = `<img class="product-thumb" src="${prod.image}" alt="">`;
                } else {
                    thumbHtml = `<div class="product-thumb-placeholder">${t.soonText}</div>`;
                }

                let stockBadge = '';
                if (prod.stock === false) {
                    stockBadge = `<div class="out-of-stock-badge">${t.outOfStockText}</div>`;
                    pCard.style.opacity = '0.6';
                }

                // Doğrudan seçilen dildeki veriyi tablo yapısından çekiyoruz
                const displayName = (typeof prod.name === 'object') ? (prod.name[currentLang] || prod.name['tr']) : prod.name;
                const displayDesc = (typeof prod.desc === 'object') ? (prod.desc[currentLang] || prod.desc['tr']) : prod.desc;

                pCard.innerHTML = `
                    ${thumbHtml}
                    <div class="product-info">
                        <div class="product-name">${displayName}</div>
                        <div class="product-desc-preview">${displayDesc}</div>
                        <div class="product-price">${prod.price}</div>
                        ${stockBadge}
                    </div>
                `;
                pCard.onclick = () => openProductDetail(prod);
                container.appendChild(pCard);
            });

            goToPage('page-products');
        }

        function backToProducts() {
            openCategory(currentCatIndex);
        }

        function openProductDetail(prod) {
            const containerEl = document.getElementById('detail-img-container');
            const t = uiTexts[currentLang];
            containerEl.innerHTML = '';

            if (prod.image && prod.image.trim() !== "") {
                const imgEl = document.createElement('img');
                imgEl.className = 'detail-img';
                imgEl.src = prod.image;
                containerEl.appendChild(imgEl);
            } else {
                const placeholderEl = document.createElement('div');
                placeholderEl.className = 'detail-img-placeholder';
                placeholderEl.innerText = t.soonText;
                containerEl.appendChild(placeholderEl);
            }

            const displayName = (typeof prod.name === 'object') ? (prod.name[currentLang] || prod.name['tr']) : prod.name;
            const displayDesc = (typeof prod.desc === 'object') ? (prod.desc[currentLang] || prod.desc['tr']) : prod.desc;

            document.getElementById('detail-title').innerText = displayName;
            document.getElementById('detail-desc').innerText = displayDesc;
            document.getElementById('detail-price').innerText = prod.price;

            goToPage('page-detail');
        }

        function handleAdminLogin() {
            const user = document.getElementById('admin-user').value.trim();
            const pass = document.getElementById('admin-pass').value.trim();
            const errEl = document.getElementById('login-error');

            if (user === 'bunfunmarmaris' && pass === 'ufukirem53') {
                errEl.style.display = 'none';
                document.getElementById('admin-user').value = '';
                document.getElementById('admin-pass').value = '';
                renderAdminPanel();
                goToPage('page-admin-panel');
            } else {
                errEl.style.display = 'block';
            }
        }

            goToPage('page-language');

        function renderAdminPanel() {
            const container = document.getElementById('admin-products-container');
            container.innerHTML = '';

            menuData.categories.forEach((cat, cIdx) => {
                const catHeader = document.createElement('h3');
                catHeader.style.cssText = "font-size: 16px; color: #c73729; margin: 15px 0 8px 0; border-bottom: 2px solid #c73729; padding-bottom: 4px;";
                catHeader.innerText = cat.name.tr;
                container.appendChild(catHeader);

                cat.products.forEach((prod, pIdx) => {
                    const row = document.createElement('div');
                    row.className = 'admin-product-row';
                    
                    const isChecked = prod.stock !== false ? 'checked' : '';
                    const prodNameTr = (typeof prod.name === 'object') ? prod.name.tr : prod.name;
                    const prodDescTr = (typeof prod.desc === 'object') ? prod.desc.tr : prod.desc;

                    row.innerHTML = `
                        <h4>${prodNameTr}</h4>
                        <div class="admin-row-inputs">
                            <input type="text" id="desc_${cIdx}_${pIdx}" value="${prodDescTr}" placeholder="Açıklama">
                            <input type="text" id="price_${cIdx}_${pIdx}" class="price-input" value="${prod.price}" placeholder="Fiyat">
                        </div>
                        <label class="admin-checkbox-label">
                            <input type="checkbox" id="stock_${cIdx}_${pIdx}" ${isChecked}> Stokta Var (Kaldırılırsa tükendi yazar)
                        </label>
                    `;
                    container.rowsData = prod; 
                    container.appendChild(row);
                });
            });
        }

        function saveAdminChanges() {
            menuData.categories.forEach((cat, cIdx) => {
                cat.products.forEach((prod, pIdx) => {
                    const descInput = document.getElementById(`desc_${cIdx}_${pIdx}`);
                    const priceInput = document.getElementById(`price_${cIdx}_${pIdx}`);
                    const stockInput = document.getElementById(`stock_${cIdx}_${pIdx}`);

                    if (descInput && priceInput && stockInput) {
                        // Açıklamanın Türkçe versiyonunu güncelliyoruz
                        if (typeof prod.desc === 'object') {
                            prod.desc.tr = descInput.value;
                        } else {
                            prod.desc = descInput.value;
                        }
                        prod.price = priceInput.value;
                        prod.stock = stockInput.checked;
                    }
                });
            });

            localStorage.setItem('bunfun_menu_data', JSON.stringify(menuData));
            alert('Değişiklikler başarıyla kaydedildi ve tüm cihazlarda anında güncellendi!');
            goToPage('page-categories');
            renderCategories();
        }
